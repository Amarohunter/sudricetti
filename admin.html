<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel Bispo — Declaração de Dízimo</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto;} </style>
</head>
<body class="bg-gray-50">
  <div id="root" class="p-6 min-h-screen"></div>

  <script type="text/babel">
  // -----------------
  // CONFIG: insira suas credenciais FIREBASE
  // -----------------
  const firebaseConfig = {
    apiKey: "INSIRA_AQUI",
    authDomain: "INSIRA_AQUI",
    projectId: "INSIRA_AQUI",
    storageBucket: "INSIRA_AQUI",
    messagingSenderId: "INSIRA_AQUI",
    appId: "INSIRA_AQUI"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const ADMIN_PASSWORD = 'Bispado2025';

  function App(){
    const [ok,setOk]=React.useState(false);
    const [appointments,setAppointments]=React.useState({});
    const [loading,setLoading]=React.useState(true);

    React.useEffect(()=>{
      const p = prompt('Senha do painel (Bispo)');
      if(p === ADMIN_PASSWORD) setOk(true); else { alert('Senha inválida'); }
    },[]);

    React.useEffect(()=>{ if(!ok) return; auth.signInAnonymously(); const unsub2 = db.collection('tithing_appointments').onSnapshot(snap=>{ const m={}; snap.forEach(d=> m[d.id]=d.data()); setAppointments(m); setLoading(false); }); return ()=>{ unsub2 && unsub2(); } },[ok]);

    function exportExcel(){ const rows = Object.values(appointments).map(a=>({ Família:a.family, Telefone:a.phone, WhatsApp:a.whatsapp? 'Sim':'Não', Data:a.date, Horário:a.time, Timestamp:new Date(a.timestamp).toLocaleString(), Email: a.email || '' })); const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'agendamentos'); const wbout=XLSX.write(wb,{bookType:'xlsx', type:'array'}); const blob=new Blob([wbout],{type:'application/octet-stream'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`agendamentos_${new Date().toISOString().slice(0,10)}.xlsx`; a.click(); URL.revokeObjectURL(url); }

    async function remove(id){ if(!confirm('Remover?')) return; await db.collection('tithing_appointments').doc(id).delete(); }

    function openCalendarPrefill(a){
      const dtStart = new Date(a.date+'T'+a.time+':00');
      const dtEnd = new Date(dtStart.getTime() + 30*60000);
      const toIso = d=> d.toISOString().replace(/[-:]/g,'').split('.')[0];
      const startStr = toIso(dtStart);
      const endStr = toIso(dtEnd);
      const text = encodeURIComponent('Entrevista Dízimo - ' + a.family);
      const details = encodeURIComponent('Contato: ' + (a.phone||'') );
      const url = `https://www.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${startStr}/${endStr}&details=${details}`;
      window.open(url, '_blank');
    }

    return (
      <div className="max-w-4xl mx-auto">
        <div className="bg-white p-6 rounded shadow mb-6">
          <h1 className="text-2xl font-bold">Painel Bispo</h1>
          <p className="text-sm text-gray-500">Apenas para uso do Bispado</p>
        </div>

        {!ok && (<div className="bg-white p-6 rounded shadow">Acesso bloqueado</div>)}

        {ok && (
          <div className="bg-white p-6 rounded shadow">
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-bold">Agendamentos ({Object.keys(appointments).length})</h2>
              <div className="flex gap-2"><button onClick={exportExcel} className="px-3 py-2 rounded bg-blue-600 text-white">Exportar XLSX</button></div>
            </div>

            <div className="space-y-3 max-h-72 overflow-auto">
              {loading && <div>Carregando...</div>}
              {Object.entries(appointments).map(([id,a])=> (
                <div key={id} className="p-3 border rounded flex items-center justify-between">
                  <div>
                    <div className="font-semibold">{a.family}</div>
                    <div className="text-xs text-gray-500">{a.date} • {a.time} — {a.phone}</div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={()=> openCalendarPrefill(a)} className="px-2 py-1 rounded border">Criar no Google Agenda</button>
                    <button onClick={()=> remove(id)} className="px-2 py-1 rounded text-red-600">Remover</button>
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-6 text-sm text-gray-500">Lista de membros (acesso restrito): <a href="assets/Lista de Membros - dizimo.pdf" target="_blank" rel="noopener">Abrir PDF</a></div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
