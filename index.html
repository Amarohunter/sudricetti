function generateSlots(dateStr, startStr, endStr){
  const out=[]; 
  let cur=new Date(`${dateStr}T${startStr}:00`); 
  const end=new Date(`${dateStr}T${endStr}:00`);
  while(cur<end){ 
    const time=cur.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); 
    out.push({id:`${dateStr}-${time.replace(':','')}`,date:dateStr,time}); 
    cur.setMinutes(cur.getMinutes()+DURATION_MINUTES);
  } 
  return out;
}

const ALL_SLOTS=[]; 
SCHEDULE_RULES.forEach(r=> r.slots.forEach(s=> ALL_SLOTS.push(...generateSlots(r.date,s.start,s.end))));
const SLOTS_BY_DAY = ALL_SLOTS.reduce((a,s)=>{ (a[s.date]||(a[s.date]=[])).push(s); return a; },{});

function formatDateFriendly(dateStr){ 
  const d=new Date(dateStr+'T12:00:00'); 
  return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}); 
}
function validPhone(p){ 
  if(!p) return false; 
  const d=p.replace(/\D/g,""); 
  return /^\d{10,11}$/.test(d); 
}
