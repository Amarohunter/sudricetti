<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Declaração de Dízimo 2025</title>

  <!-- React / ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS for Excel export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <!-- QR generation (qrcodejs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root{ --gold-600:#c59b14; --gold-700:#b08812; --gold-50:#fff8ec; }
    .fade-in { animation: fadein .32s ease-in-out; }
    @keyframes fadein { from {opacity:0; transform:translateY(6px);} to {opacity:1; transform:translateY(0);} }
    .shadow-card{ box-shadow: 0 8px 20px rgba(16,24,40,0.06); }
    .suggestion { cursor: pointer; padding:0.4rem 0.6rem; border-radius:0.4rem; }
    .suggestion:hover { background:#f8f8f8; }
  </style>
</head>
<body className="bg-slate-50">
  <div id="root" className="min-h-screen"></div>

<script type="text/babel">
// ----------------------
// CONFIG FIREBASE
// ----------------------
const firebaseConfig = {
  apiKey: "INSIRA_AQUI",
  authDomain: "INSIRA_AQUI",
  projectId: "INSIRA_AQUI",
  storageBucket: "INSIRA_AQUI",
  messagingSenderId: "INSIRA_AQUI",
  appId: "INSIRA_AQUI"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ----------------------
// ADMIN TOKEN (URL)
// ----------------------
const ADMIN_TOKEN = 'BISPADO2025'; // secret expected in ?admin=TOKEN

// ----------------------
// HORÁRIOS (30 min)
// ----------------------
const DURATION_MINUTES = 30;
const SCHEDULE_RULES = [
  { date: '2025-12-02', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-03', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-04', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-05', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-06', slots: [{ start: '09:00', end: '11:00' }, { start: '14:00', end: '17:00' }] },
  { date: '2025-12-07', slots: [{ start: '14:00', end: '17:00' }] },
  { date: '2025-12-09', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-10', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-11', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-12', slots: [{ start: '19:00', end: '21:30' }] },
  { date: '2025-12-13', slots: [{ start: '14:00', end: '17:00' }] },
  { date: '2025-12-14', slots: [{ start: '14:00', end: '17:00' }] }
];

function generateSlots(dateStr, startStr, endStr){
  const out = [];
  let cur = new Date(`${dateStr}T${startStr}:00`);
  const end = new Date(`${dateStr}T${endStr}:00`);
  while(cur < end){
    const time = cur.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    out.push({ id: `${dateStr}-${time.replace(':','')}`, date: dateStr, time });
    cur.setMinutes(cur.getMinutes()+DURATION_MINUTES);
  }
  return out;
}

const ALL_SLOTS = [];
SCHEDULE_RULES.forEach(r=> r.slots.forEach(s=> ALL_SLOTS.push(...generateSlots(r.date,s.start,s.end))));
const SLOTS_BY_DAY = ALL_SLOTS.reduce((a,s)=>{ (a[s.date]||(a[s.date]=[])).push(s); return a; },{});

// ----------------------
// FAMILY HEADS (autocomplete source)
// extracted from the PDF you provided
// ----------------------
const FAMILY_HEADS = [
  "Ávila, Henrique Falcão & Larissa Araujo Pereira",
  "Barbosa, Custodio Salles",
  "Cardoso, Leonardo Estevão Souza & Cinthia da Costa Silva",
  "Costa, Maria Eunice",
  "Dziabas, Cassio De Mattos & Bárbara Silveira Dionizio",
  "Ferrer Morillo, Rafael Esteban & Adriana del Valle",
  "Gutierrez Gonzalez, Jordalis Octavio & Malvis Eukaris de",
  "Leonardo, Valter & Lilian Cristina Machado",
  "Maria, Fernando Tito & Lucimara Cristina Chinelati",
  "Migliato, Marco Aurelio Tonissi & Marcia Regina dos Santos",
  "De Oliveira, Antonio Marcos de & Liliane Maria Leite de",
  "Pellegrini, Roberto Aparecido & Valeria Ribeiro",
  "Pereira, Joana de Jesus",
  "Plaine, José Aparecido & Inia Marilda Petille",
  "Ramos, Rafael da Silva & Evelin Yumi Yamashiro",
  "Rodrigues, Marília Aparecida Guete",
  "Rodrigues, Robson Alves & Meire Valentina Guette",
  "Rodriguez, Morian Santana & Raísa Daniela Diniz",
  "Santana, Claudio José",
  "Santos, Vinicius & Jennyfer Gabriele",
  "Silva, Erasmo Pereira da & Erika Vieira Alves",
  "Silva, Gustavo Jesus & Laís Cassiano",
  "Silva, Lucas Brito da",
  "Silva, Mara Rúbia Fonseca da",
  "Silva, Roberta Pellegrini da",
  "Silva Junior, Humbelino Amaro e & Janiely da Silva",
  "Siqueira, Adão Aparecido & Maria Vera Beribilli",
  "Suehara, Douglas Carlos & Giselle Silva Torquato",
  "Teodoro, Breno Mizael de Medeiros & Amanda Oliveira Messias",
  "Tiengo, João & Maria Genilce Calazans Ribeiro",
  "Trebbi, Adriano José & Denise Morais da Silva",
  "Trebbi, Alexandre José"
];

// Suggest families matching any substring (flexible autocomplete)
function suggestFamilies(query){
  if(!query) return [];
  const q = query.trim().toLowerCase();
  return FAMILY_HEADS.filter(f=> f.toLowerCase().includes(q)).slice(0,12);
}

// ----------------------
// Helpers
// ----------------------
function formatDateFriendly(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
}
function validPhone(p){ if(!p) return false; const digits = p.replace(/\D/g,''); return /^\d{10,11}$/.test(digits); }

// ----------------------
// App
// ----------------------
function App(){
  const [user,setUser] = React.useState(null);
  const [appointments,setAppointments] = React.useState({});
  const [family,setFamily] = React.useState('');
  const [phone,setPhone] = React.useState('');
  const [whatsapp,setWhatsapp] = React.useState(true);
  const [selectedSlot,setSelectedSlot] = React.useState(null);
  const [step,setStep] = React.useState(1);
  const [loading,setLoading] = React.useState(true);
  const [adminMode,setAdminMode] = React.useState(false);
  const [query,setQuery] = React.useState('');
  const [suggestions,setSuggestions] = React.useState([]);

  React.useEffect(()=>{ auth.signInAnonymously(); const unsub = auth.onAuthStateChanged(u=> setUser(u)); return ()=> unsub && unsub(); },[]);

  // detect admin token in URL
  React.useEffect(()=>{
    const params = new URLSearchParams(window.location.search);
    const token = params.get('admin');
    if(token && token === ADMIN_TOKEN) setAdminMode(true);
  },[]);

  React.useEffect(()=>{
    if(!user) return;
    const unsub = db.collection('tithing_appointments').onSnapshot(snap=>{
      const map = {};
      snap.forEach(doc=> map[doc.id]=doc.data());
      setAppointments(map);
      setLoading(false);
    },err=>{ console.error(err); setLoading(false); });
    return ()=> unsub();
  },[user]);

  // suggestions logic
  React.useEffect(()=>{
    if(!query) return setSuggestions([]);
    setSuggestions(suggestFamilies(query));
  },[query]);

  async function reserve(){
    if(!selectedSlot) return alert('Selecione um horário');
    if(!family) return alert('Informe o nome da família');
    if(!validPhone(phone)) return alert('Informe um telefone válido (somente números, DDD + número)');

    // Limite: 1 agendamento por família
    const already = Object.values(appointments).find(a => a.family?.toLowerCase().trim() === family.toLowerCase().trim());
    if(already){
      return alert('Esta família já possui um agendamento. Caso precise alterar, peça para o administrador remover.');
    }

    const payload = {
      family: family.trim(),
      phone: phone.replace(/\D/g,''),
      whatsapp: !!whatsapp,
      slotId: selectedSlot.id,
      date: selectedSlot.date,
      time: selectedSlot.time,
      timestamp: Date.now()
    };

    try{
      await db.collection('tithing_appointments').doc(selectedSlot.id).set(payload);
      // optimistic local update so slot immediately appears taken
      setAppointments(prev=> ({ ...prev, [selectedSlot.id]: payload }));
      setStep(3);
    }catch(e){ console.error(e); alert('Erro ao reservar. Tente novamente.'); }
  }

  async function adminDelete(id){ if(!confirm('Remover agendamento?')) return; await db.collection('tithing_appointments').doc(id).delete(); }

  function exportExcel(){
    if(!adminMode){ alert('Apenas administrador pode exportar.'); return; }
    const rows = Object.values(appointments).map(a=>({ Família: a.family, Telefone: a.phone, WhatsApp: a.whatsapp? 'Sim':'Não', Data: a.date, Horário: a.time, Timestamp: new Date(a.timestamp).toLocaleString() }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'agendamentos');
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `agendamentos_${new Date().toISOString().slice(0,10)}.xlsx`; a.click(); URL.revokeObjectURL(url);
  }

  function generateQRCode(){ const container = document.getElementById('qrcode'); container.innerHTML=''; new QRCode(container, { text: window.location.href, width:128, height:128 }); }

  // when user selects a suggestion, auto-fill family and clear suggestions
  function selectSuggestion(name){ setFamily(name); setQuery(''); setSuggestions([]); }

  return (
    <div className="max-w-4xl mx-auto p-6">

      <header className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-extrabold" style={{color:'var(--gold-700)'}}>Declaração de Dízimo 2025</h1>
          <p className="text-sm text-slate-500">Agendamento de entrevista com o Bispo</p>
        </div>

        <div className="flex items-center gap-3">
          <button className="px-3 py-2 rounded-md font-medium" style={{background:'var(--gold-50)', color:'var(--gold-700)'}} onClick={()=>{ navigator.clipboard?.writeText(window.location.href); alert('Link copiado!'); }}>Copiar link</button>
          <div className="text-sm text-slate-500">{adminMode? 'Modo Administrador' : 'Modo Público'}</div>
        </div>
      </header>

      <main className="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <section className="bg-white p-6 rounded-xl shadow-card fade-in">
          <h2 className="text-lg font-bold mb-3" style={{color:'var(--gold-700)'}}>Preencha seus dados</h2>

          <label className="block text-sm text-slate-600 mb-1">Procurar nome (autocomplete)</label>
          <input value={query} onChange={e=> setQuery(e.target.value)} className="w-full p-3 border rounded mb-2" placeholder="Digite nome ou parte dele (ex: Sil)" />
          {suggestions.length>0 && (
            <div className="border rounded mb-3 p-2">
              {suggestions.map(s=> (
                <div key={s} className="suggestion" onClick={()=> selectSuggestion(s)}>{s}</div>
              ))}
            </div>
          )}

          <label className="block text-sm text-slate-600 mb-1">Nome selecionado</label>
          <input value={family} onChange={e=> setFamily(e.target.value)} className="w-full p-3 border rounded mb-3" placeholder="Ou digite manualmente" />

          <label className="block text-sm text-slate-600 mb-1">Telefone (DDD + número)</label>
          <input value={phone} onChange={e=> setPhone(e.target.value)} className="w-full p-3 border rounded mb-2" placeholder="(11) 98888-7777" />
          <div className="flex items-center gap-2 text-sm mb-4">
            <input id="wa" type="checkbox" checked={whatsapp} onChange={e=> setWhatsapp(e.target.checked)} />
            <label htmlFor="wa">Possui WhatsApp?</label>
          </div>

          <div className="mb-4">
            <label className="block text-sm text-slate-600 mb-1">Escolha o horário (30 min)</label>
            <div className="space-y-4 max-h-64 overflow-auto">
              {Object.keys(SLOTS_BY_DAY).sort().map(date => (
                <div key={date} className="mb-2">
                  <div className="text-sm font-semibold mb-2">{formatDateFriendly(date)}</div>
                  <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                    {SLOTS_BY_DAY[date].map(slot=>{
                      const taken = !!appointments[slot.id];
                      const selected = selectedSlot?.id === slot.id;
                      return (
                        <button key={slot.id}
                          disabled={taken}
                          onClick={()=> setSelectedSlot(slot)}
                          className={`p-2 rounded-md text-sm border transition-all ${taken? 'bg-red-100 text-red-600 cursor-not-allowed' : ''} ${selected? 'bg-gradient-to-br from-yellow-500 to-yellow-600 text-white border-yellow-600':''}`}
                        >{slot.time}</button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="flex gap-3">
            <button onClick={reserve} disabled={!family || !selectedSlot || !validPhone(phone)} style={{background:'var(--gold-700)', color:'#fff'}} className="px-4 py-2 rounded-md font-bold">Confirmar</button>
            <button onClick={()=>{ setFamily(''); setPhone(''); setWhatsapp(true); setSelectedSlot(null); setQuery(''); setSuggestions([]); }} className="px-4 py-2 rounded-md border">Limpar</button>
          </div>

          <div className="mt-4 text-sm text-slate-500">Baixe a lista de membros (PDF): <a className="text-gold-700 underline" href="/mnt/data/Lista de Membros - dizimo.pdf">Lista de Membros - dizimo.pdf</a></div>

          <div className="mt-6">
            <div id="qrcode" />
            <button onClick={generateQRCode} className="mt-2 text-sm" style={{color:'var(--gold-700)'}}>Gerar QR Code</button>
          </div>
        </section>

        <aside className="space-y-4">

          <div className="bg-white p-6 rounded-xl shadow-card fade-in">
            <h3 className="font-bold text-slate-700">Resumo</h3>
            <p className="text-sm text-slate-500">Selecionado: {selectedSlot? `${formatDateFriendly(selectedSlot.date)} • ${selectedSlot.time}` : '—'}</p>
            <p className="text-sm text-slate-500">Família: {family || '—'}</p>
            <p className="text-sm text-slate-500">Telefone: {phone || '—'}</p>
          </div>

          <div className="bg-white p-6 rounded-xl shadow-card fade-in">
            <h3 className="font-bold text-slate-700">Ações</h3>
            <div className="flex flex-col gap-2 mt-3">
              <button className="px-3 py-2 rounded" style={{background:'var(--gold-50)', color:'var(--gold-700)'}} onClick={()=>{ navigator.clipboard?.writeText(window.location.href); alert('Link copiado'); }}>Copiar link</button>
              {adminMode && (<button className="px-3 py-2 rounded" style={{background:'var(--gold-600)', color:'#fff'}} onClick={exportExcel}>Exportar Excel</button>)}
              <button className="px-3 py-2 rounded" onClick={()=>{ setFamily(''); setPhone(''); setSelectedSlot(null); }}>Nova inscrição</button>
            </div>
          </div>

          {adminMode && (
            <div className="bg-white p-6 rounded-xl shadow-card fade-in">
              <div className="flex items-center justify-between">
                <h3 className="font-bold">Painel Administrativo</h3>
                <div className="text-sm text-slate-500">Total: {Object.keys(appointments).length}</div>
              </div>

              <div className="mt-4 max-h-72 overflow-auto space-y-3">
                {loading && <div className="text-sm text-slate-400">Carregando...</div>}
                {Object.keys(appointments).length===0 && !loading && (<div className="text-sm text-slate-500">Nenhum agendamento</div>)}
                {Object.entries(appointments).map(([id,a])=> (
                  <div key={id} className="p-3 border rounded flex items-start justify-between gap-3">
                    <div>
                      <div className="font-semibold">{a.family}</div>
                      <div className="text-xs text-slate-500">{a.date} • {a.time}</div>
                      <div className="text-xs text-slate-500">{a.phone} • WhatsApp: {a.whatsapp? 'Sim':'Não'}</div>
                    </div>
                    <div className="flex flex-col gap-2">
                      <button onClick={()=> navigator.clipboard.writeText(`${window.location.href}`)} className="text-sm">Copiar link</button>
                      <button onClick={()=> adminDelete(id)} className="text-sm text-red-600">Remover</button>
                    </div>
                  </div>
                ))}
              </div>

            </div>
          )}

        </aside>

      </main>

      {step===3 && (
        <div className="fixed inset-0 bg-black/30 flex items-center justify-center p-4">
          <div className="bg-white p-6 rounded-xl max-w-lg w-full text-center">
            <h2 className="text-xl font-bold" style={{color:'var(--gold-700)'}}>Agendamento confirmado ✅</h2>
            <p className="mt-2">Família <strong>{family}</strong></p>
            <p>{selectedSlot?.date} às {selectedSlot?.time}</p>
            <p className="mt-3 text-sm text-slate-500">Tire um print dessa tela ou peça ao administrador o relatório.</p>
            <div className="mt-4 flex justify-center gap-3">
              <button onClick={()=>{ setStep(1); setFamily(''); setPhone(''); setSelectedSlot(null); }} className="px-4 py-2 rounded" style={{background:'var(--gold-600)', color:'#fff'}}>Fechar</button>
              <button onClick={()=>{ setStep(1); }} className="px-4 py-2 rounded border">Novo</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
